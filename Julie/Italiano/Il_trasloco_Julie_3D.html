<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Il trasloco</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#364a91,#10172f 70%);color:white;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:20px}.hero{text-align:center;padding:20px}.emoji{font-size:75px;display:block;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-15px) rotate(7deg)}}h1{font-size:clamp(28px,6vw,50px);margin:8px} .panel{background:#ffffff18;border:1px solid #ffffff38;border-radius:25px;padding:25px;box-shadow:0 20px 70px #0005;backdrop-filter:blur(12px)}.story{font-size:clamp(20px,3vw,26px);line-height:1.85;white-space:pre-wrap}.word{cursor:pointer}.word:hover{background:#ffffff35;border-radius:5px}button{background:linear-gradient(120deg,#ffdb70,#ff9b68);border:0;border-radius:15px;padding:14px 20px;font-size:17px;font-weight:800;color:#252342;cursor:pointer;margin:5px}button:disabled{opacity:.35} .actions{display:flex;flex-wrap:wrap;justify-content:center;margin-top:15px}.progress{height:12px;background:#ffffff30;border-radius:20px;overflow:hidden;margin:15px 0}.fill{height:100%;background:#70efc4;transition:width .3s}.option{display:block;width:100%;text-align:left;background:#ffffff24;color:white;border:1px solid #ffffff44}.option.good{background:#17895c}.option.bad{background:#a94152}.small{opacity:.85}#scene{text-align:center;font-size:55px;cursor:pointer;user-select:none;perspective:500px}#scene span{display:inline-block;transition:transform .5s}#scene:active span{transform:rotateY(180deg) scale(1.3)}</style></head><body><main class="wrap" id="app"></main><script>const D={"title": "Il trasloco", "chapters": ["La casa si stava svuotando a poco a poco. Nella stanza di Gianni le tende non c’erano più e dai vetri sporchi si intravedeva un grande albero verde. Niente più letto, tavolo, sedia, scaffale con i giochi e i libri.", "Gianni si sentiva molto triste. Era come se gli avessero tolto i vestiti, i capelli, la pelle.", "Quegli uomini gli portavano via tutta la sua casa e la mettevano in un furgone enorme, senza finestre.", "Chi gli ridarà la stanza sul cortile? Chi guarderà il passerotto sui rami del suo albero?", "Gianni si sedette a terra e rannicchiò le gambe, stringendo le ginocchia con le braccia.\nChe cosa fa un bambino quando si sente disperato? Gianni lo era e non sapeva come fare per mandar giù quel mostro nero che gli stringeva la gola."], "questions": [{"q": "Come si chiama il protagonista?", "answers": ["Gianni", "Bobby", "Marco"]}, {"q": "Che cosa stava succedendo alla casa?", "answers": ["Si svuotava", "Si riempiva", "Si dipingeva"]}, {"q": "Cosa non c’era più alle finestre?", "answers": ["Le tende", "Le persiane", "I fiori"]}, {"q": "Cosa si vedeva dai vetri?", "answers": ["Un grande albero verde", "Un lago", "Una montagna"]}, {"q": "Come si sentiva Gianni?", "answers": ["Molto triste", "Felice", "Entusiasta"]}, {"q": "Dove mettevano gli oggetti?", "answers": ["In un furgone enorme", "In una barca", "In un treno"]}, {"q": "Com’era il furgone?", "answers": ["Senza finestre", "Rosso e piccolo", "Con molti finestrini"]}, {"q": "Quale uccellino ricordava Gianni?", "answers": ["Un passerotto", "Un gufo", "Un’aquila"]}, {"q": "Dove si sedette Gianni?", "answers": ["A terra", "Sul letto", "Sul tavolo"]}, {"q": "Cosa stringeva con le braccia?", "answers": ["Le ginocchia", "Un cuscino", "Un libro"]}], "emoji": "📦"};let page=0,qi=0,score=0,answered=false,muted=false;const root=document.getElementById('app');function say(t){if(muted||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.85;speechSynthesis.speak(u)}function words(s){return s.split(/(\s+)/).map(w=>/\S/.test(w)?'<span class="word" data-word="'+encodeURIComponent(w.replace(/[“”.,!?;:–]/g,''))+'">'+escapeH(w)+'</span>':w).join('')}function escapeH(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let quiz=page>=D.chapters.length;root.innerHTML='<div class="hero"><div id="scene" title="Tocca la magia"><span>'+D.emoji+'</span></div><h1>'+D.title+'</h1><div class="small">Avventura di lettura di Julie ✨</div></div><div class="panel"><div class="progress"><div class="fill" style="width:'+((quiz?5+qi:page+1)/15*100)+'%"></div></div><div id="content"></div></div>';document.getElementById('scene').onclick=()=>{let s=document.querySelector('#scene span');s.style.transform='rotateY(360deg) scale(1.3)';setTimeout(()=>s.style.transform='',550)};let el=document.getElementById('content');if(!quiz){el.innerHTML='<h2>📖 Capitolo '+(page+1)+' di 5</h2><div class="story">'+words(D.chapters[page])+'</div><div class="actions"><button id="prev">◀ Indietro</button><button id="read">🔊 Leggi</button><button id="mute">'+(muted?'🔇 Audio spento':'🔈 Audio acceso')+'</button><button id="next">'+(page===4?'Vai al quiz 🏆':'Avanti ▶')+'</button></div>';el.querySelectorAll('.word').forEach(x=>x.onclick=()=>say(decodeURIComponent(x.dataset.word)));document.getElementById('prev').onclick=()=>{page=Math.max(0,page-1);render()};document.getElementById('read').onclick=()=>say(D.chapters[page]);document.getElementById('mute').onclick=()=>{muted=!muted;speechSynthesis.cancel();render()};document.getElementById('next').onclick=()=>{page++;render()}}else if(qi<10){let q=D.questions[qi];el.innerHTML='<h2>🧠 Domanda '+(qi+1)+' / 10</h2><h2>'+escapeH(q.q)+'</h2><div id="answers"></div><p id="feedback"></p><button id="nextQ" disabled>Prossima domanda ▶</button>';let answers=q.answers.map((a,i)=>({a,i})).sort((a,b)=>((a.a.length*7+qi*13)%11)-((b.a.length*7+qi*13)%11));answers.forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o.a;b.onclick=()=>{if(answered)return;answered=true;let ok=o.i===0;if(ok)score++;document.querySelectorAll('.option').forEach(btn=>{btn.disabled=true;if(btn.textContent===q.answers[0])btn.classList.add('good');else if(btn===b)btn.classList.add('bad')});document.getElementById('feedback').textContent=(ok?'🌟 Bravissima! ':'💡 Riprova a ricordare: ')+q.answers[0];document.getElementById('nextQ').disabled=false};document.getElementById('answers').appendChild(b)});document.getElementById('nextQ').onclick=()=>{qi++;answered=false;render()}}else{el.innerHTML='<div style="text-align:center"><div style="font-size:75px">🏆</div><h2>Diploma di Julie!</h2><h1>'+score+' / 10</h1><p>Hai completato l’avventura «'+D.title+'»!</p><button id="again">🔁 Rifai il quiz</button><button id="restart">📚 Rileggi la storia</button></div>';document.getElementById('again').onclick=()=>{qi=0;score=0;render()};document.getElementById('restart').onclick=()=>{page=0;qi=0;score=0;render()}}}render();</script></body></html>
