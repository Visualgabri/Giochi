<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Un amico speciale</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#364a91,#10172f 70%);color:white;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:20px}.hero{text-align:center;padding:20px}.emoji{font-size:75px;display:block;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-15px) rotate(7deg)}}h1{font-size:clamp(28px,6vw,50px);margin:8px} .panel{background:#ffffff18;border:1px solid #ffffff38;border-radius:25px;padding:25px;box-shadow:0 20px 70px #0005;backdrop-filter:blur(12px)}.story{font-size:clamp(20px,3vw,26px);line-height:1.85;white-space:pre-wrap}.word{cursor:pointer}.word:hover{background:#ffffff35;border-radius:5px}button{background:linear-gradient(120deg,#ffdb70,#ff9b68);border:0;border-radius:15px;padding:14px 20px;font-size:17px;font-weight:800;color:#252342;cursor:pointer;margin:5px}button:disabled{opacity:.35} .actions{display:flex;flex-wrap:wrap;justify-content:center;margin-top:15px}.progress{height:12px;background:#ffffff30;border-radius:20px;overflow:hidden;margin:15px 0}.fill{height:100%;background:#70efc4;transition:width .3s}.option{display:block;width:100%;text-align:left;background:#ffffff24;color:white;border:1px solid #ffffff44}.option.good{background:#17895c}.option.bad{background:#a94152}.small{opacity:.85}#scene{text-align:center;font-size:55px;cursor:pointer;user-select:none;perspective:500px}#scene span{display:inline-block;transition:transform .5s}#scene:active span{transform:rotateY(180deg) scale(1.3)}</style></head><body><main class="wrap" id="app"></main><script>const D={"title": "Un amico speciale", "chapters": ["", "“Sarà di certo un giorno da ricordare” pensa Eva mentre percorre a testa alta via dei Fagiani, con un cagnolino al guinzaglio. Il cane assomiglia un po’ a un bassotto, un po’ a un volpino e un po’ a un barboncino. Il suo pelo è marrone sul davanti, bruno chiaro nel mezzo e rosso bruno dietro. La punta della buffa coda attorcigliata è nera come la pece.", "– Ciao Eva! – esclama la giornalaia. – Da quando hai un cane?", "– Da oggi! – risponde Eva, raggiante. – L’abbiamo preso al canile e adesso è tutto mio! Lo porto a spasso perché conosca la città.", "Bobby zampetta accanto a Eva. Il cagnolino è di ottimo umore e annusa curioso l’ingresso delle abitazioni."], "questions": [{"q": "Come si chiama la bambina?", "answers": ["Eva", "Laura", "Giusi"]}, {"q": "Dove passeggia Eva?", "answers": ["Via dei Fagiani", "Nel bosco", "Al mare"]}, {"q": "Chi accompagna Eva?", "answers": ["Bobby", "Gianni", "Un gatto"]}, {"q": "Dove hanno preso il cane?", "answers": ["Al canile", "Al mercato", "A scuola"]}, {"q": "Chi saluta Eva?", "answers": ["La giornalaia", "La maestra", "La zia"]}, {"q": "A quale razza assomiglia anche il cane?", "answers": ["Bassotto", "Alano", "Levriero"]}, {"q": "Di che colore è la punta della coda?", "answers": ["Nera", "Bianca", "Gialla"]}, {"q": "Com’è la coda?", "answers": ["Attorcigliata", "Dritta", "Corta e liscia"]}, {"q": "Perché Eva porta Bobby a spasso?", "answers": ["Per fargli conoscere la città", "Per andare a scuola", "Per cercare un gatto"]}, {"q": "Che umore ha Bobby?", "answers": ["Ottimo", "Triste", "Arrabbiato"]}], "emoji": "🐶"};let page=0,qi=0,score=0,answered=false,muted=false;const root=document.getElementById('app');function say(t){if(muted||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.85;speechSynthesis.speak(u)}function words(s){return s.split(/(\s+)/).map(w=>/\S/.test(w)?'<span class="word" data-word="'+encodeURIComponent(w.replace(/[“”.,!?;:–]/g,''))+'">'+escapeH(w)+'</span>':w).join('')}function escapeH(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let quiz=page>=D.chapters.length;root.innerHTML='<div class="hero"><div id="scene" title="Tocca la magia"><span>'+D.emoji+'</span></div><h1>'+D.title+'</h1><div class="small">Avventura di lettura di Julie ✨</div></div><div class="panel"><div class="progress"><div class="fill" style="width:'+((quiz?5+qi:page+1)/15*100)+'%"></div></div><div id="content"></div></div>';document.getElementById('scene').onclick=()=>{let s=document.querySelector('#scene span');s.style.transform='rotateY(360deg) scale(1.3)';setTimeout(()=>s.style.transform='',550)};let el=document.getElementById('content');if(!quiz){el.innerHTML='<h2>📖 Capitolo '+(page+1)+' di 5</h2><div class="story">'+words(D.chapters[page])+'</div><div class="actions"><button id="prev">◀ Indietro</button><button id="read">🔊 Leggi</button><button id="mute">'+(muted?'🔇 Audio spento':'🔈 Audio acceso')+'</button><button id="next">'+(page===4?'Vai al quiz 🏆':'Avanti ▶')+'</button></div>';el.querySelectorAll('.word').forEach(x=>x.onclick=()=>say(decodeURIComponent(x.dataset.word)));document.getElementById('prev').onclick=()=>{page=Math.max(0,page-1);render()};document.getElementById('read').onclick=()=>say(D.chapters[page]);document.getElementById('mute').onclick=()=>{muted=!muted;speechSynthesis.cancel();render()};document.getElementById('next').onclick=()=>{page++;render()}}else if(qi<10){let q=D.questions[qi];el.innerHTML='<h2>🧠 Domanda '+(qi+1)+' / 10</h2><h2>'+escapeH(q.q)+'</h2><div id="answers"></div><p id="feedback"></p><button id="nextQ" disabled>Prossima domanda ▶</button>';let answers=q.answers.map((a,i)=>({a,i})).sort((a,b)=>((a.a.length*7+qi*13)%11)-((b.a.length*7+qi*13)%11));answers.forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o.a;b.onclick=()=>{if(answered)return;answered=true;let ok=o.i===0;if(ok)score++;document.querySelectorAll('.option').forEach(btn=>{btn.disabled=true;if(btn.textContent===q.answers[0])btn.classList.add('good');else if(btn===b)btn.classList.add('bad')});document.getElementById('feedback').textContent=(ok?'🌟 Bravissima! ':'💡 Riprova a ricordare: ')+q.answers[0];document.getElementById('nextQ').disabled=false};document.getElementById('answers').appendChild(b)});document.getElementById('nextQ').onclick=()=>{qi++;answered=false;render()}}else{el.innerHTML='<div style="text-align:center"><div style="font-size:75px">🏆</div><h2>Diploma di Julie!</h2><h1>'+score+' / 10</h1><p>Hai completato l’avventura «'+D.title+'»!</p><button id="again">🔁 Rifai il quiz</button><button id="restart">📚 Rileggi la storia</button></div>';document.getElementById('again').onclick=()=>{qi=0;score=0;render()};document.getElementById('restart').onclick=()=>{page=0;qi=0;score=0;render()}}}render();</script></body></html>
