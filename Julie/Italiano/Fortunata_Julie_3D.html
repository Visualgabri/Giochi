<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortunata! Julie</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui;background:radial-gradient(circle at 50% 10%,#345d93,#101b40 65%,#080c20);min-height:100vh}main{max-width:850px;margin:auto;padding:22px}h1{font-size:clamp(38px,9vw,76px);text-align:center;margin:12px;text-shadow:0 5px 20px #6bdcff}h2{color:#ffdc83}.scene{height:240px;perspective:700px;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(#80b8e8,#eac3a0 72%,#44446b 73%);box-shadow:0 20px 50px #0008}.roof{position:absolute;bottom:-55px;left:15%;width:70%;height:125px;background:repeating-linear-gradient(0deg,#793c4e,#793c4e 18px,#ad6271 20px);transform:rotateX(48deg);border-radius:25px}.bird{position:absolute;font-size:80px;left:43%;top:30px;filter:drop-shadow(0 12px 9px #3338);transition:transform 1s,top 1s,left 1s;cursor:pointer}.bird.fly{transform:translateY(-95px) rotate(-16deg) scale(.8)}.cat{position:absolute;font-size:75px;bottom:25px;left:15%;cursor:pointer}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 2px);background-size:38px 38px;opacity:.3}.panel{margin-top:22px;background:#ffffff15;border:1px solid #ffffff38;border-radius:22px;padding:24px;backdrop-filter:blur(10px)}p{font-size:clamp(20px,4vw,27px);line-height:1.65}button{background:#ffce63;color:#172448;border:0;border-radius:14px;padding:13px 17px;margin:5px;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.3}.secondary{background:#c3eaff}.word{cursor:pointer}.word:hover{text-decoration:underline;color:#ffda70}.bar{height:12px;background:#ffffff30;border-radius:20px;overflow:hidden}.fill{height:100%;background:#ffcf60;transition:width .3s}.choices button{display:block;width:100%;text-align:left;margin:10px 0;background:#d9ebff}.choices button.correct{background:#7be4a2}.choices button.wrong{background:#ff9c9c}.hidden{display:none}.small{font-size:16px;color:#d6e9ff}#feedback{font-size:20px;min-height:36px}</style></head><body><main><h1>🪽 FORTUNATA! 🐈</h1><div class="scene"><div class="stars"></div><div class="roof"></div><div class="cat" onclick="meow()" title="Accarezza Zorba">🐈‍⬛</div><div class="bird" id="bird" onclick="fly()" title="Aiuta Fortunata a volare">🐦</div></div><div class="panel"><div class="bar"><div class="fill" id="fill"></div></div><div class="small" id="progress"></div><section id="reading"><h2 id="chapter"></h2><p id="story"></p><div><button onclick="prev()">◀ Indietro</button><button onclick="next()" id="next">Avanti ▶</button><button class="secondary" onclick="speak()">🔊 Leggi</button><button class="secondary" onclick="stopSpeak()">🔇 Stop</button></div><p class="small">Tocca una parola per ascoltarla. Tocca Fortunata per farla volare e Zorba per sentirlo miagolare!</p></section><section id="quiz" class="hidden"><h2>🌟 La sfida di Julie</h2><div id="qcount"></div><p id="question"></p><div class="choices" id="choices"></div><div id="feedback"></div><button id="advance" onclick="nextQuestion()" class="hidden">Prossima domanda ▶</button></section><section id="diploma" class="hidden"><h2>🏆 Diploma di lettrice</h2><p id="score"></p><button onclick="restartQuiz()">Rifai le domande 🔄</button><button onclick="restart()">Rileggi la storia 📖</button></section></div></main><script>
const chapters=[
['La gabbianella e i gatti','Fortunata era una giovane gabbiana che viveva con gli amici gatti. Il gatto Diderot cercava nei libri un modo per insegnarle a volare.'],
['Un desiderio speciale','Fortunata però non voleva volare, voleva essere un gatto.'],
['Le parole di Mattia','Un giorno, lo scimpanzè Mattia la chiamò “uccellaccio” e disse che i gatti la stavano ingannando e che volevano mangiarla. Fortunata si sentì molto triste.'],
['La famiglia di Fortunata','Zorba, il gatto nero grande e grosso, cercò di consolarla: – Ti abbiamo curata fin da quando sei uscita dall’uovo e ti vogliamo gabbiana. Sentiamo che anche tu ci vuoi bene, che siamo la tua famiglia. Con te abbiamo imparato a rispettare e amare un essere diverso.'],
['La promessa di Zorba','Zorba promise a Fortunata che le avrebbe insegnato a volare. Camminavano insieme. Il gatto leccava la testa della gabbianella, lei lo abbracciava con un’ala.']];
const questions=[['Chi era Fortunata?',['Una giovane gabbiana','Una gatta nera','Una scimmietta'],0,'Fortunata era una giovane gabbiana.'],['Con chi viveva Fortunata?',['Con i cani','Con gli amici gatti','Con gli scimpanzè'],1,'Viveva con i suoi amici gatti.'],['Come si chiamava il gatto che cercava nei libri?',['Zorba','Mattia','Diderot'],2,'Era Diderot.'],['Che cosa cercava Diderot?',['Un modo per insegnarle a volare','Una ricetta','Una mappa'],0,'Cercava un modo per insegnarle a volare.'],['Che cosa voleva essere Fortunata?',['Uno scimpanzè','Un gatto','Un pesce'],1,'Fortunata voleva essere un gatto.'],['Chi la chiamò “uccellaccio”?',['Mattia','Zorba','Diderot'],0,'Fu lo scimpanzè Mattia.'],['Che cosa disse Mattia dei gatti?',['Che volevano aiutarla','Che dormivano sempre','Che volevano mangiarla'],2,'Mattia disse che volevano mangiarla.'],['Come si sentì Fortunata?',['Felice','Molto triste','Arrabbiata'],1,'Si sentì molto triste.'],['Che cosa avevano imparato i gatti da Fortunata?',['A rispettare e amare un essere diverso','A nuotare','A leggere'],0,'Avevano imparato a rispettare e amare un essere diverso.'],['Che cosa promise Zorba?',['Di comprarle un libro','Di insegnarle a volare','Di portarla al mare'],1,'Le promise che le avrebbe insegnato a volare.']];
let page=0,qi=0,points=0,answered=false,audio=true;const el=id=>document.getElementById(id);function render(){el('chapter').textContent='Capitolo '+(page+1)+' · '+chapters[page][0];el('story').innerHTML='';chapters[page][1].split(/(\s+)/).forEach(w=>{let s=document.createElement('span');s.textContent=w;s.className='word';s.onclick=()=>say(w);el('story').append(s)});el('progress').textContent='Capitolo '+(page+1)+' di '+chapters.length;el('fill').style.width=((page+1)/chapters.length*100)+'%';el('next').textContent=page===4?'Vai al quiz 🎯':'Avanti ▶'}function say(t){if(!audio||!('speechSynthesis'in window))return;stopSpeak();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.85;speechSynthesis.speak(u)}function speak(){say(chapters[page][1])}function stopSpeak(){if('speechSynthesis'in window)speechSynthesis.cancel()}function prev(){stopSpeak();page=Math.max(0,page-1);render()}function next(){stopSpeak();if(page<4){page++;render()}else{el('reading').classList.add('hidden');el('quiz').classList.remove('hidden');renderQuestion()}}function tone(f=440){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);o.start();o.stop(c.currentTime+.3)}catch(e){}}function fly(){el('bird').classList.toggle('fly');tone(650)}function meow(){tone(240);setTimeout(()=>tone(330),120)}function renderQuestion(){answered=false;el('advance').classList.add('hidden');el('feedback').textContent='';el('qcount').textContent='Domanda '+(qi+1)+' di 10';el('question').textContent=questions[qi][0];el('choices').innerHTML='';questions[qi][1].forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(i);el('choices').append(b)})}function answer(i){if(answered)return;answered=true;let q=questions[qi];if(i===q[2]){points++;tone(780)}else tone(220);[...el('choices').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});el('feedback').textContent=(i===q[2]?'✅ Bravissima! ':'💡 Riproviamo a ricordare! ')+q[3];el('advance').classList.remove('hidden');el('advance').textContent=qi===9?'Vedi il diploma 🏆':'Prossima domanda ▶'}function nextQuestion(){qi++;if(qi<10)renderQuestion();else{el('quiz').classList.add('hidden');el('diploma').classList.remove('hidden');el('score').textContent='Julie, hai conquistato '+points+' stelle su 10! ⭐ '+(points===10?'Perfetto!':'Continua così!')}}function restartQuiz(){qi=0;points=0;el('diploma').classList.add('hidden');el('quiz').classList.remove('hidden');renderQuestion()}function restart(){page=0;el('diploma').classList.add('hidden');el('reading').classList.remove('hidden');render()}render();
</script></body></html>
