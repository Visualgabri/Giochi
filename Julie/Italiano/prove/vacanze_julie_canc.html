<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Vacanze Scientifiche di Julie 🚀🔬</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka+One&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-page: #e8f4f8; 
            --primary: #0984e3;
            --secondary: #00cec9;
            --text: #2d3436;
            --locked: #b2bec3;
        }

        body {
            font-family: 'Patrick Hand', cursive;
            margin: 0;
            min-height: 100vh;
            background-color: var(--bg-page);
            color: var(--text);
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        /* DASHBOARD - MENU PRINCIPALE */
        #dashboard {
            max-width: 900px;
            width: 95%;
            margin: 20px auto;
            text-align: center;
        }
        
        h1 { font-family: 'Fredoka One', cursive; color: var(--primary); font-size: 2.8rem; text-shadow: 2px 2px 0px white; }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .level-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            border: 4px solid var(--secondary);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .level-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .level-card.locked { background: #dfe6e9; border-color: var(--locked); cursor: not-allowed; transform: none; }
        .level-card.locked .emoji { filter: grayscale(100%); opacity: 0.5; }
        
        .level-card .emoji { font-size: 4rem; margin: 10px 0; }
        .level-card .title { font-size: 1.5rem; font-weight: bold; }
        .level-card .reads { font-size: 1.2rem; color: #d63031; margin-top: 10px; font-weight: bold;}
        .lock-icon { position: absolute; top: 10px; right: 10px; font-size: 1.5rem; }

        .stats-bar {
            background: white; padding: 10px 20px; border-radius: 20px; border: 2px solid var(--primary);
            display: inline-block; font-size: 1.5rem; font-weight: bold; margin-bottom: 20px;
        }

        /* VISTA STORIA */
        #story-view {
            display: none;
            max-width: 850px;
            width: 90%;
            background: #ffffff;
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-top: 20px;
            text-align: center;
            border: 5px solid var(--primary);
        }

        .btn-back {
            background: var(--primary); color: white; border: none; padding: 10px 20px;
            font-size: 1.2rem; border-radius: 15px; cursor: pointer;
            font-family: 'Fredoka One', cursive; float: left;
            margin-bottom: 15px;
        }

        .story-box {
            font-size: 1.8rem;
            line-height: 1.6;
            text-align: left;
            padding: 25px;
            background: #fafafa;
            border-radius: 20px;
            border: 2px dashed var(--secondary);
            margin: 20px 0;
            white-space: pre-line;
            clear: both;
        }

        /* PAROLE INTERATTIVE */
        .interactive-word {
            display: inline-block;
            transition: all 0.2s;
            position: relative;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            margin: 0 1px;
        }
        
        .interactive-word:hover, .interactive-word.active-touch {
            background-color: #ffeaa7;
            transform: scale(1.15);
            z-index: 10;
            color: var(--primary);
            font-weight: bold;
        }

        .word-tooltip {
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.5rem;
            background: white;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 100;
            border: 2px solid var(--primary);
            pointer-events: none;
        }

        .interactive-word:hover .word-tooltip, .interactive-word.active-touch .word-tooltip {
            opacity: 1;
            visibility: visible;
        }

        /* SCENA MAGICA */
        #magic-scene {
            height: 180px;
            background: #f1f2f6;
            border-radius: 20px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            position: relative;
            border: 3px solid var(--primary);
            overflow: hidden;
            transition: background-color 0.5s;
        }

        .magic-item { position: absolute; animation: bounceIn 0.6s ease-out; }
        @keyframes bounceIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        /* CONTROLLI STELLINE */
        .controls { margin-top: 15px; }
        .stars-container { display: flex; gap: 15px; font-size: 3.5rem; color: #dfe6e9; justify-content: center; margin: 15px 0; }
        .star { cursor: pointer; transition: 0.3s; }
        .star.active { color: #fdcb6e; transform: scale(1.2); text-shadow: 0 0 15px rgba(253, 203, 110, 0.5); }
        #msg { font-size: 1.5rem; color: var(--primary); font-weight: bold; min-height: 1.5em; }

    </style>
</head>

        // GESTIONE DATI (Salvataggi nel browser)
        let progress = JSON.parse(localStorage.getItem('julie_vacanze_2026_v4')) || {
            unlocked: 0,
            reads: Array(storiesData.length).fill(0)
        };

        function saveData() {
            localStorage.setItem('julie_vacanze_2026_v4', JSON.stringify(progress));
            updateDashboard();
        }

        let currentStoryIndex = 0;
        let currentStep = 0;
        let audioCtx; 

        // INIZIALIZZAZIONE MENU
        function updateDashboard() {
            const grid = document.getElementById('levels-grid');
            grid.innerHTML = '';
            
            let totalReads = progress.reads.reduce((a,b) => a + b, 0);
            document.getElementById('total-reads').innerText = totalReads;

            storiesData.forEach((story, index) => {
                const isLocked = index > progress.unlocked;
                const card = document.createElement('div');
                card.className = `level-card ${isLocked ? 'locked' : ''}`;
                
                card.innerHTML = `
                    ${isLocked ? '<div class="lock-icon">🔒</div>' : ''}
                    <div class="emoji">${story.icon}</div>
                    <div class="title">Livello ${index + 1}</div>
                    ${!isLocked ? `<div class="reads">Letta: ${progress.reads[index]} volte</div>` : ''} 
                `;

                if (!isLocked) {
                    card.onclick = () => openStory(index);
                }
                grid.appendChild(card);
            });
        }

        // APRI STORIA (Testo TUTTO visibile e parole interattive)
        function openStory(index) {
            currentStoryIndex = index;
            currentStep = 0;
            const story = storiesData[index];
            
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('story-view').style.display = 'block';
            document.getElementById('story-title').innerText = story.title;
            
            // Pulisci magia e resetta stelle
            document.getElementById('magic-scene').innerHTML = '<span id="base-scene" style="font-size: 4rem;">✨</span>';
            document.getElementById('magic-scene').style.backgroundColor = '#f1f2f6';
            document.getElementById('msg').innerText = "Tocca le parole, poi tocca la prima stella!";
            
            for(let i=1; i<=5; i++) {
                document.getElementById(`s${i}`).classList.remove('active');
            }

            // Prepara TUTTO IL TESTO unendo le frasi e separando le parole
            const display = document.getElementById('textDisplay');
            const fullText = story.sentences.join(' '); 
            
            display.innerHTML = fullText.split(/\s+/).map(word => {
                const clean = word.replace(/[.,!'’!?…“”-]/g, '').toUpperCase();
                const emoji = story.dict[clean];
                
                if (emoji) {
                    return `<span class="interactive-word" onclick="toggleTouch(this, event)">${word}<div class="word-tooltip">${emoji}</div></span>`;
                }
                return `<span class="interactive-word" onclick="toggleTouch(this, event)">${word}</span>`;
            }).join(' ');
        }

        // GESTIONE EFFETTI TOUCH SU PAROLE (Per tablet)
        function toggleTouch(el, event) {
            event.stopPropagation();
            document.querySelectorAll('.interactive-word').forEach(w => w.classList.remove('active-touch'));
            el.classList.add('active-touch');
        }

        function clearTouch(event) {
            if (!event.target.classList.contains('interactive-word')) {
                document.querySelectorAll('.interactive-word').forEach(w => w.classList.remove('active-touch'));
            }
        }

        // TORNA ALLA HOME
        function goHome() {
            document.getElementById('story-view').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            updateDashboard();
        }

        // MESSAGGI DINAMICI
        const progressMessages = [
            "Bravissima Julie, hai iniziato a leggere! 🌟",
            "Continua così, stai andando benissimo! 📖",
            "Ottimo lavoro, sei a metà strada! ✨",
            "Ci sei quasi, manca pochissimo! 🚀",
            "Completata! Sei una vera scienziata! 🎉"
        ];

        // PROGRESSIONE SCENA MAGICA (Cliccando le stelle)
        function registerRead(num) {
            if (num !== currentStep + 1) return; // Deve cliccare in ordine
            
            currentStep = num;
            const story = storiesData[currentStoryIndex];
            
            // Accendi la stella
            document.getElementById(`s${currentStep}`).classList.add('active');
            document.getElementById('msg').innerText = progressMessages[currentStep - 1];
            
            // Colora lo sfondo della scena magica
            const scene = document.getElementById('magic-scene');
            scene.style.backgroundColor = story.colors[currentStep - 1];
            
            // Aggiungi un elemento magico in posizione casuale
            const span = document.createElement('span');
            span.innerText = story.magic[currentStep - 1];
            span.className = 'magic-item';
            span.style.top = (10 + Math.random() * 50) + '%';
            span.style.left = (15 + Math.random() * 60) + '%';
            scene.appendChild(span);

            // Suono
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); 
            gain.connect(audioCtx.destination);
            osc.frequency.value = 400 + (currentStep * 100);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(); 
            osc.stop(audioCtx.currentTime + 0.3);

            // Fine lettura della storia
            if (currentStep === 5) {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                
                // Aggiorna salvataggi
                progress.reads[currentStoryIndex]++;
                
                // Sblocca livello successivo se esiste
                if (currentStoryIndex === progress.unlocked && progress.unlocked < storiesData.length - 1) {
                    progress.unlocked++;
                }
                saveData();
            }
        }

        // Avvio iniziale
        updateDashboard();
    </script>
