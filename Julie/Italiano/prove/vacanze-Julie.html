<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julie - Le Vacanze Scientifiche Magiche 🚀🔬</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka+One&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-page: #e0f7fa; 
            --primary: #00838f;
            --secondary: #00bcd4;
            --highlight-bg: #b2ebf2;
            --text-color: #263238;
            --border-color: #4dd0e1;
            --quiz-bg: #fff8e1;
            --quiz-border: #ffca28;
            --badge-bg: #fff3e0;
            --badge-border: #ff9800;
        }

        body {
            font-family: 'Patrick Hand', cursive;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-page);
            user-select: none;
            padding-bottom: 50px;
        }

        /* HEADER E TABELLONE SEGNAPUNTI */
        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--badge-bg);
            border: 3px solid var(--badge-border);
            border-radius: 20px;
            padding: 10px 25px;
            margin-top: 15px;
            width: 85%;
            max-width: 800px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .score-item {
            font-size: 1.6rem;
            font-weight: bold;
            color: #e65100;
            font-family: 'Fredoka One', cursive;
        }

        /* DASHBOARD - MAPPA DELLE 20 STORIE */
        #dashboard {
            max-width: 900px;
            width: 90%;
            margin-top: 15px;
            text-align: center;
        }

        h1 { 
            font-family: 'Fredoka One', cursive; 
            color: var(--primary); 
            font-size: 2.3rem; 
            margin: 5px 0;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px white;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .level-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            border: 4px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
            text-align: center;
        }

        .level-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 10px 18px rgba(0,0,0,0.12);
            background: #f1fbfc;
        }

        .level-card .emoji { font-size: 3.2rem; margin-bottom: 5px; }
        .level-card .title { font-family: 'Fredoka One', cursive; font-size: 1.2rem; color: var(--primary); }
        .level-card .badge-status { font-size: 1rem; color: #4caf50; font-weight: bold; margin-top: 5px; }

        /* VISTA DELLA STORIA */
        #story-view {
            display: none;
            max-width: 850px;
            width: 90%;
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-top: 15px;
            text-align: center;
            border: 5px solid var(--border-color);
        }

        .btn-back {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 1.2rem;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Fredoka One', cursive;
            float: left;
            transition: 0.2s;
        }

        .btn-back:hover { background: #006064; transform: scale(1.05); }

        /* TRACCIATORE DELLE 3 LETTURE COMPLETA */
        #read-tracker {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 15px;
            border: 2px solid #e0e0e0;
            clear: both;
        }

        .trophy-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
            color: #757575;
        }

        .trophy {
            font-size: 2.5rem;
            filter: grayscale(100%);
            opacity: 0.3;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .trophy.earned {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.2);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        #msg { 
            font-size: 1.5rem; 
            color: #d32f2f; 
            font-weight: bold; 
            min-height: 2em; 
            background: #ffebee;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px dashed #ef9a9a;
            transition: 0.3s;
        }

        .story-box {
            font-size: 1.7rem;
            line-height: 1.6;
            text-align: left;
            padding: 20px;
            background: #f1fbfc;
            border-radius: 20px;
            border: 2px dashed var(--border-color);
            margin: 15px 0;
            white-space: pre-line;
            color: var(--text-color);
        }

        .story-part {
            margin-bottom: 12px;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* PAROLE INTERATTIVE */
        .interactive-word {
            display: inline-block;
            transition: all 0.2s;
            position: relative;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
        }
        
        .interactive-word:hover, .interactive-word.active-touch {
            color: #000;
            background-color: var(--highlight-bg);
            transform: scale(1.1);
            z-index: 10;
        }

        .word-tooltip {
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.2rem;
            background: white;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 100;
            border: 2px solid var(--border-color);
            pointer-events: none;
        }

        .interactive-word:hover .word-tooltip, .interactive-word.active-touch .word-tooltip {
            opacity: 1;
            visibility: visible;
        }

        /* SCENA MAGICA */
        #magic-scene {
            height: 160px;
            background: #f9f9f9;
            border-radius: 20px;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4.5rem;
            position: relative;
            border: 3px solid var(--border-color);
            transition: background-color 0.8s;
            overflow: hidden;
        }

        .magic-item { position: absolute; animation: bounceIn 0.6s ease-out; }
        @keyframes bounceIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        /* STELLINE */
        .stars-container { display: flex; gap: 15px; font-size: 3.5rem; color: #b0bec5; justify-content: center; margin: 15px 0; }
        .star { cursor: pointer; transition: 0.3s; }
        .star.active { color: #fbc02d; transform: scale(1.2); text-shadow: 0 0 15px rgba(251, 192, 45, 0.6); }
        .star.disabled { pointer-events: none; opacity: 0.3; }

        /* PULSANTE PROSSIMA LETTURA */
        #next-read-btn {
            display: none;
            width: 100%;
            background: #4caf50;
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            padding: 15px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            animation: bounceIn 0.5s ease-in-out;
            text-transform: uppercase;
        }

        #next-read-btn:hover { background: #43a047; transform: scale(1.02); }

        /* QUIZ */
        #quiz-section {
            display: none;
            background: var(--quiz-bg);
            border: 4px solid var(--quiz-border);
            border-radius: 20px;
            padding: 20px;
            margin-top: 25px;
            text-align: left;
            animation: fadeIn 1s ease-in;
        }

        #quiz-section h2 { margin-top: 0; color: #f57f17; font-family: 'Fredoka One', cursive; text-align: center; }
        .quiz-question { font-size: 1.5rem; margin-bottom: 12px; font-weight: bold; color: #3e2723; }
        .quiz-btn {
            display: block; width: 100%; background: white; border: 2px solid var(--quiz-border);
            border-radius: 12px; padding: 12px; font-size: 1.4rem; font-family: 'Patrick Hand', cursive;
            margin-bottom: 10px; cursor: pointer; transition: 0.2s; text-align: left;
        }
        .quiz-btn:hover { background: #fffde7; transform: scale(1.01); }
        .quiz-btn.correct { background: #c8e6c9; border-color: #388e3c; color: #1b5e20; }
        .quiz-btn.wrong { background: #ffccbc; border-color: #d32f2f; color: #b71c1c; }
        .feedback { font-size: 1.3rem; font-weight: bold; min-height: 25px; text-align: center; }
    </style>
</head>

                magic: ["💻", "👨‍💻", "🔢", "🤖", "✨"], colors: ["#d1d8e0", "#a5b1c2", "#4b6584", "#20bf6b", "#0fb9b1"],
                quiz: [
                    { q: "COSA usano i computer per funzionare?", options: [ {t: "Il codice 🔢", c: true}, {t: "La farina 🌾", c: false} ] },
                    { q: "DI CHI avranno sempre bisogno i robot?", options: [ {t: "Degli umani 🙋‍♀️", c: true}, {t: "Nessuno ❌", c: false} ] }

        ];

        let currentStoryIndex = 0;
        let sentenceCount = 0;
        let currentReadCycle = 1; // Richieste 3 letture!
        let totalScore = 0;
        const maxReads = 3;

        const stepInstructions = [
            "Bravissima! Ora leggi la frase 2 e tocca la stella 2.",
            "Ottimo! Leggi la frase 3 e tocca la stella 3.",
            "Stai andando benissimo! Leggi la frase 4 e tocca la stella 4.",
            "Ci sei quasi! Leggi la frase 5 e tocca la stella 5."
        ];

        function initDashboard() {
            const grid = document.getElementById('levels-grid');
            grid.innerHTML = '';
            storiesData.forEach((story, idx) => {
                const card = document.createElement('div');
                card.className = 'level-card';
                card.onclick = () => loadStory(idx);
                card.innerHTML = `
                    <div class="emoji">${story.icon}</div>
                    <div class="title">${story.title}</div>
                `;
                grid.appendChild(card);
            });
            updateScoreDisplay();
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = `⭐ Punti: ${totalScore}`;
            let badge = "Scienziata Junior 🐣";
            if (totalScore >= 300) badge = "Esploratrice 🧭";
            if (totalScore >= 700) badge = "Super Scienziata 🔬";
            if (totalScore >= 1200) badge = "Campionessa Stellare 🌟";
            document.getElementById('badge-display').innerText = `🎖️ Grado: ${badge}`;
        }

        function loadStory(index) {
            currentStoryIndex = index;
            sentenceCount = 0;
            currentReadCycle = 1;

            const story = storiesData[index];

            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('story-view').style.display = 'block';
            document.getElementById('story-title').innerText = story.title;

            // Reset Trofei Letture
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`trophy-${i}`).classList.remove('earned');
            }

            // Reset UI
            setupReadCycle();
            buildQuiz(story.quiz);
        }

        function setupReadCycle() {
            sentenceCount = 0;
            document.getElementById('textDisplay').innerHTML = '';
            document.getElementById('magic-scene').innerHTML = '<span id="base-scene">✨</span>';
            document.getElementById('magic-scene').style.backgroundColor = "#f9f9f9";
            document.getElementById('stars-container').style.display = 'flex';
            document.getElementById('next-read-btn').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'none';

            document.getElementById('msg').innerHTML = `Lettura ${currentReadCycle} di 3! Leggi la prima frase e tocca la stella 1.`;
            document.getElementById('msg').style.background = "#ffebee";
            document.getElementById('msg').style.borderColor = "#ef9a9a";
            document.getElementById('msg').style.color = "#d32f2f";

            // Reset Stelle
            for (let i = 1; i <= 5; i++) {
                let star = document.getElementById(`s${i}`);
                star.className = 'star';
                if (i > 1) star.classList.add('disabled');
            }

            renderStoryPart(0);
        }

        function renderStoryPart(index) {
            const story = storiesData[currentStoryIndex];
            const display = document.getElementById('textDisplay');
            const newPart = document.createElement('div');
            newPart.className = 'story-part';

            const htmlWords = story.sentences[index].split(/\s+/).map(word => {
                const clean = word.replace(/[.,!'’!?…—"-]/g, '').toUpperCase();
                const emoji = story.dict[clean];
                
                if (emoji) {
                    return `<span class="interactive-word" onclick="toggleTouch(this, event)">${word}<div class="word-tooltip">${emoji}</div></span>`;
                }
                return `<span class="interactive-word" onclick="toggleTouch(this, event)">${word}</span>`;
            }).join(' ');

            newPart.innerHTML = htmlWords;
            display.appendChild(newPart);
        }

        function toggleTouch(el, event) {
            event.stopPropagation();
            document.querySelectorAll('.interactive-word').forEach(w => w.classList.remove('active-touch'));
            el.classList.add('active-touch');
        }

        function clearTouch(event) {
            if (!event.target.classList.contains('interactive-word')) {
                document.querySelectorAll('.interactive-word').forEach(w => w.classList.remove('active-touch'));
            }
        }

        function addMagic(emoji, top, left) {
            const scene = document.getElementById('magic-scene');
            const span = document.createElement('span');
            span.innerText = emoji;
            span.className = 'magic-item';
            span.style.top = top + '%';
            span.style.left = left + '%';
            scene.appendChild(span);
        }

        function playSound(frequency) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = frequency;
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function registerRead(num) {
            if (num !== sentenceCount + 1) return; 
            
            sentenceCount = num;
            const story = storiesData[currentStoryIndex];
            const scene = document.getElementById('magic-scene');
            
            document.getElementById(`s${sentenceCount}`).classList.add('active');

            if (sentenceCount < 5) {
                document.getElementById(`s${sentenceCount+1}`).classList.remove('disabled');
                document.getElementById('msg').innerHTML = stepInstructions[sentenceCount-1];
                renderStoryPart(sentenceCount);
            }

            // Aggiungi magia visiva
            scene.style.backgroundColor = story.colors[sentenceCount-1];
            addMagic(story.magic[sentenceCount-1], 20 + Math.random()*40, 15 + Math.random()*60);

            // Fine di UNA lettura completa (5 stelle)
            if(sentenceCount === 5) {
                document.getElementById(`trophy-${currentReadCycle}`).classList.add('earned');
                document.getElementById('stars-container').style.display = 'none';

                totalScore += 50; // Punti per ogni lettura completata
                updateScoreDisplay();

                if (currentReadCycle < maxReads) {
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
                    document.getElementById('msg').innerHTML = `Bravissima! Hai completato la lettura ${currentReadCycle} di ${maxReads}! 🎉 (+50 Punti)`;
                    document.getElementById('msg').style.background = "#e8f5e9";
                    document.getElementById('msg').style.borderColor = "#4caf50";
                    document.getElementById('msg').style.color = "#2e7d32";

                    const nextBtn = document.getElementById('next-read-btn');
                    nextBtn.innerText = `Inizia la Lettura ${currentReadCycle + 1} ▶️`;
                    nextBtn.style.display = 'block';
                } else {
                    // Completate tutte e 3 le letture!
                    document.getElementById('msg').innerHTML = `COMPLIMENTI JULIE! 🏆 Hai letto la storia 3 volte! Ora gioca al Quiz Finale!`;
                    document.getElementById('msg').style.background = "#e8f5e9";
                    document.getElementById('msg').style.borderColor = "#4caf50";
                    document.getElementById('msg').style.color = "#2e7d32";

                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

                    setTimeout(() => {
                        document.getElementById('quiz-section').style.display = 'block';
                        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                    }, 1200);
                }
            }
            
            playSound(400 + (sentenceCount * 100));
        }

        function startNextReadCycle() {
            currentReadCycle++;
            setupReadCycle();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            playSound(300);
        }

        function buildQuiz(quizData) {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            
            quizData.forEach((qObj, qIndex) => {
                const qDiv = document.createElement('div');
                qDiv.style.marginBottom = "20px";
                qDiv.innerHTML = `<div class="quiz-question">${qObj.q}</div>`;
                
                qObj.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-btn';
                    btn.innerText = opt.t;
                    btn.onclick = () => checkAnswer(btn, qIndex + 1, opt.c);
                    qDiv.appendChild(btn);
                });

                const fb = document.createElement('div');
                fb.id = `feedback-${qIndex + 1}`;
                fb.className = 'feedback';
                qDiv.appendChild(fb);

                container.appendChild(qDiv);
            });
        }

        function checkAnswer(btn, questionNum, isCorrect) {
            const feedback = document.getElementById(`feedback-${questionNum}`);
            const siblings = btn.parentElement.querySelectorAll('.quiz-btn');
            siblings.forEach(b => b.style.pointerEvents = 'none');

            if (isCorrect) {
                btn.classList.add('correct');
                feedback.innerHTML = "✨ Esatto! Bravissima! (+20 Punti)";
                feedback.style.color = "#2e7d32";
                
                totalScore += 20;
                updateScoreDisplay();

                confetti({ particleCount: 50, spread: 40, origin: { y: 0.8 } });
            } else {
                btn.classList.add('wrong');
                feedback.innerHTML = "Ops! Riprova.";
                feedback.style.color = "#c62828";
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    feedback.innerHTML = "";
                    siblings.forEach(b => b.style.pointerEvents = 'auto');
                }, 1800);
            }
        }

        function goHome() {
            document.getElementById('story-view').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            initDashboard();
        }

        // Avvio iniziale
        initDashboard();
    </script>
