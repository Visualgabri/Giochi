<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Julie • Magica stagione</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#172c46,#64412c 65%,#b76a35);color:#fff;min-height:100vh}.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:.6}.leaf{position:absolute;font-size:36px;animation:fall 12s linear infinite}@keyframes fall{from{transform:translateY(-15vh) rotate(0)}to{transform:translateY(115vh) rotate(600deg)}}main{position:relative;max-width:780px;margin:auto;padding:26px 16px 70px}h1{font-size:clamp(30px,7vw,54px);text-shadow:0 4px 15px #0007}.card{background:#fffef2;color:#27303b;border-radius:25px;padding:clamp(20px,5vw,38px);box-shadow:0 20px 70px #0006}p{font-size:clamp(20px,3.6vw,27px);line-height:1.8}.word{cursor:pointer;border-radius:5px}.word:hover,.word:focus{background:#ffe39a}button{cursor:pointer;border:0;border-radius:14px;background:#f9bb53;color:#292432;font-weight:800;padding:14px 18px;font-size:16px;margin:5px}button:disabled{opacity:.4;cursor:default}.controls{display:flex;flex-wrap:wrap;justify-content:center;margin:16px 0}.muted{color:#fbe8c8}.progress{height:12px;background:#ffffff50;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#ffcf73;transition:width .3s}.answer{display:block;width:100%;text-align:left;background:#e6edf4;margin:10px 0}.answer.correct{background:#a8e5ac}.answer.wrong{background:#ffb6a7}.hidden{display:none}.special{font-size:65px;text-align:center;cursor:pointer;user-select:none;filter:drop-shadow(0 8px 6px #0003);transition:transform .3s}.special:active{transform:rotate(20deg) scale(1.2)}#feedback{font-weight:700;font-size:18px}.hint{font-size:14px} </style><div class="scene" id="scene"></div><main><h1 id="title"></h1><div class="progress"><div id="bar"></div></div><p class="muted" id="status"></p><section class="card"><h2 id="heading"></h2><p id="story"></p><div class="special" id="special" role="button" tabindex="0" aria-label="Gioca con le foglie">🍂</div><p class="hint" id="hint">Tocca le foglie per farle volare!</p><div id="quiz" class="hidden"><div id="answers"></div><p id="feedback" aria-live="polite"></p></div></section><div class="controls"><button id="prev">◀ Indietro</button><button id="read">🔊 Leggi</button><button id="mute">🔈 Audio attivo</button><button id="next">Avanti ▶</button><button id="restart">↻ Ricomincia</button></div></main><script>const DATA={"title": "Magica stagione", "chapters": ["Una mattina d’autunno, Marta si svegliò e guardò fuori dalla finestra. Il cielo era di un azzurro intenso e gli alberi del parco componevano un incredibile mosaico di colori: giallo, arancione, rosso, marrone...", "Marta indossò il suo maglione più caldo e le scarpe da ginnastica. Corse fuori. Il vento fresco le scompigliava i capelli e faceva danzare le foglie come farfalle colorate.", "Nel parco, Marta vide un piccolo scoiattolo che saltellava tra gli alberi. Teneva stretta tra le zampe una ghianda. Poi Marta notò qualcosa di brillante sul terreno. Era una grossa castagna, dalla buccia liscia e lucida.", "Marta la raccolse. Trovò anche pigne, bacche rosse e foglie di ogni forma e dimensione. Decise di raccoglierle e di portare tutto a scuola, per realizzare un grande collage dell’autunno.", "All’improvviso sentì un leggero pizzicore sul naso. Guardò in alto e vide tanti piccoli fiocchi bianchi. Era la prima neve d’autunno!"], "questions": [["Come si chiama la protagonista?", "Marta", "Lucilla", "Alberta"], ["Di che colore era il cielo?", "Azzurro intenso", "Grigio scuro", "Verde"], ["Quali colori avevano gli alberi?", "Giallo, arancione, rosso e marrone", "Solo blu", "Bianco e nero"], ["Cosa indossò Marta?", "Un maglione caldo e scarpe da ginnastica", "Un costume", "Un impermeabile giallo"], ["Cosa faceva danzare le foglie?", "Il vento fresco", "La pioggia", "Uno scoiattolo"], ["Quale animale vide Marta?", "Uno scoiattolo", "Un riccio", "Un gatto"], ["Cosa teneva lo scoiattolo?", "Una ghianda", "Una pigna", "Una castagna"], ["Com’era la castagna?", "Grossa, liscia e lucida", "Piccola e ruvida", "Verde e morbida"], ["Cosa voleva realizzare a scuola?", "Un collage dell’autunno", "Un aquilone", "Una torta"], ["Cosa cadde alla fine?", "La prima neve d’autunno", "La grandine estiva", "Una pioggia forte"]]};let page=0,score=0,answered=false,audio=true;const $=id=>document.getElementById(id);$('title').textContent=DATA.title;for(let i=0;i<16;i++){let e=document.createElement('div');e.className='leaf';e.textContent=['🍁','🍂','🌰'][i%3];e.style.left=(i*29%100)+'%';e.style.animationDelay=(-i*.73)+'s';e.style.animationDuration=(9+i%7)+'s';$('scene').append(e)}function say(t){if(!audio||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.85;speechSynthesis.speak(u)}function render(){speechSynthesis?.cancel();let q=page>=5,idx=page-5;$('bar').style.width=((page+1)/15*100)+'%';$('status').textContent=q?'Domanda '+(idx+1)+' di 10 • Punti '+score:'Capitolo '+(page+1)+' di 5';$('heading').textContent=q?(idx===10?'Diploma':'Quiz della storia'):'Capitolo '+(page+1);$('story').replaceChildren();$('quiz').classList.toggle('hidden',!q);$('special').classList.toggle('hidden',q);$('hint').classList.toggle('hidden',q);$('next').disabled=q&&!answered;$('prev').disabled=page===0;if(!q){DATA.chapters[page].split(/(\s+)/).forEach(w=>{let s=document.createElement('span');s.textContent=w;if(w.trim()){s.className='word';s.tabIndex=0;s.onclick=()=>say(w);s.onkeydown=e=>{if(e.key==='Enter')say(w)}}$('story').append(s)});$('next').disabled=false}else if(idx<10){let item=DATA.questions[idx];$('story').textContent=item[0];$('answers').replaceChildren();answered=false;let choices=[...item.slice(1)].sort((a,b)=>((a.length*17+idx)%7)-((b.length*17+idx)%7));choices.forEach(c=>{let b=document.createElement('button');b.className='answer';b.textContent=c;b.onclick=()=>{if(answered)return;answered=true;let ok=c===item[1];if(ok)score++;b.classList.add(ok?'correct':'wrong');[...$('answers').children].forEach(x=>{x.disabled=true;if(x.textContent===item[1])x.classList.add('correct')});$('feedback').textContent=(ok?'Bravissima! ':'Riprova a ricordare: ')+'La risposta è: '+item[1]+'.';$('next').disabled=false;$('status').textContent='Domanda '+(idx+1)+' di 10 • Punti '+score};$('answers').append(b)});$('feedback').textContent='';$('next').disabled=true}else{$('heading').textContent='🏆 Diploma di Julie';$('story').textContent='Complimenti! Hai ottenuto '+score+' punti su 10!';$('answers').replaceChildren();$('next').disabled=true}}$('next').onclick=()=>{if(page<14){page++;render()}};$('prev').onclick=()=>{if(page>0){page--;if(page>=5)score=0;render()}};$('read').onclick=()=>say(page<5?DATA.chapters[page]:$('story').textContent);$('mute').onclick=()=>{audio=!audio;$('mute').textContent=audio?'🔈 Audio attivo':'🔇 Audio spento';if(!audio)speechSynthesis?.cancel()};$('restart').onclick=()=>{page=0;score=0;render()};function play(){let e=$('special');e.textContent=['🍂','🍁','🌪️','🌰'][Math.floor(Math.random()*4)];e.style.transform='rotate('+(Math.random()*80-40)+'deg) scale(1.25)';setTimeout(()=>e.style.transform='',300)}$('special').onclick=play;$('special').onkeydown=e=>{if(e.key==='Enter')play()};render();</script></html>
