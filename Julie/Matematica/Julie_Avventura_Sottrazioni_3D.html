<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Julie e il Regno delle Sottrazioni</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#100d38;color:white;font-family:system-ui,Arial}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}button{font:inherit;cursor:pointer;touch-action:manipulation}#top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;justify-content:space-between} .pill{background:#ffffffde;color:#30205b;border-radius:22px;padding:9px 15px;font-weight:900;box-shadow:0 5px 0 #a69aca}#panel{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(94vw,680px);background:#fffef2f2;color:#241653;border:4px solid #fff;border-radius:30px;box-shadow:0 10px 0 #6253a0,0 20px 45px #0005;padding:18px;text-align:center;pointer-events:auto}h1{margin:4px;font-size:clamp(24px,5vw,40px)}#prompt{font-size:clamp(26px,6vw,45px);font-weight:1000;margin:8px}#hint{font-size:16px;min-height:45px;color:#5b4b86;font-weight:700}#answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.answer,.action{border:0;border-radius:18px;font-weight:1000;box-shadow:0 5px 0 #6a4ab0;background:linear-gradient(#fff5a8,#ffb63c);color:#36204e;padding:12px;font-size:clamp(24px,5vw,34px)}.answer:active,.action:active{transform:translateY(4px);box-shadow:0 1px 0 #6a4ab0}.action{font-size:17px;background:linear-gradient(#aefee7,#50d6c8)}#mode{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.mode{background:#ffffffdb;color:#39286a;border:3px solid transparent;border-radius:18px;padding:9px 14px;font-weight:900}.mode.active{border-color:#ffcd4c;background:#ffe7a1}#toast{position:absolute;top:125px;left:50%;transform:translateX(-50%);font-weight:1000;font-size:clamp(20px,5vw,32px);text-shadow:0 3px 9px #000;white-space:nowrap}#mute{pointer-events:auto;border:0;border-radius:50%;padding:10px;background:#fff;color:#35215e;font-size:20px}#progress{position:absolute;top:113px;left:15px;right:15px;height:13px;background:#ffffff88;border:2px solid white;border-radius:20px;overflow:hidden}#fill{height:100%;width:0;background:linear-gradient(90deg,#6bfbd0,#ffe570);transition:width .5s}#overlay{position:absolute;inset:0;background:#130e40d9;display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:18px}#welcome{background:linear-gradient(155deg,#fff9d8,#e9e0ff);color:#2b205b;border:5px solid white;border-radius:30px;padding:26px;max-width:520px;text-align:center;box-shadow:0 20px 80px #0008}#welcome p{font-size:19px;line-height:1.5}#steps{font-size:20px;font-weight:900;color:#6141a3}#panel[hidden],#overlay[hidden]{display:none}@media(max-height:690px){#panel{bottom:8px;padding:10px}#hint{min-height:30px;font-size:13px}#prompt{margin:2px}#mode{top:55px}#progress{top:105px}#toast{top:115px}}
</style></head><body><div id="ui"><div id="top"><div class="pill">⭐ <span id="stars">0</span> &nbsp; 🏆 <span id="level">1</span></div><div class="pill">💎 <span id="gems">0</span></div><button id="mute" aria-label="Audio">🔊</button></div><div id="mode"><button class="mode active" data-mode="10">🌈 Tappa al 10</button><button class="mode" data-mode="20">🚀 Tappa al 20</button></div><div id="progress"><div id="fill"></div></div><div id="toast"></div><div id="panel" hidden><div id="prompt"></div><div id="hint"></div><div id="answers"></div><div style="margin-top:12px;display:flex;gap:8px;justify-content:center"><button class="action" id="help">💡 Fammi vedere i passaggi</button><button class="action" id="next" hidden>Avanti ➜</button></div><div id="steps" aria-live="polite"></div></div><div id="overlay"><div id="welcome"><h1>✨ Julie e le Stelle Magiche ✨</h1><p>Viaggia in un mondo 3D, raccogli stelle e impara le sottrazioni a mente passando prima dal <b>10</b> e poi dal <b>20</b>!</p><p>Ogni risposta giusta accende la magia del castello. Puoi usare gli aiuti quando vuoi.</p><button class="action" id="start">🎮 Inizia l'avventura!</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(()=>{const $=id=>document.getElementById(id);let mode=10,score=0,gems=0,round=0,question=null,locked=false,audio=true,ctx;const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function sound(freq=500,duration=.12,type='sine'){if(!audio)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);g.gain.setValueAtTime(.09,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration)}catch(e){}}function speak(t){if(!audio||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.93;u.pitch=1.2;speechSynthesis.speak(u)}function toast(t){$('toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',2000)}function makeQuestion(){locked=false;$('next').hidden=true;$('help').hidden=false;$('steps').textContent='';let a,b,bridge,first,rest;if(mode===10){a=rand(11,19);first=a-10;rest=rand(1,Math.min(9,10));b=first+rest;bridge=10}else{a=rand(21,39);first=a-20;rest=rand(1,Math.min(9,20));b=first+rest;bridge=20}question={a,b,bridge,first,rest,result:a-b};$('prompt').textContent=`${a} − ${b} = ?`; $('hint').textContent=`🎯 Prima arriva a ${bridge}, poi continua!`;const opts=new Set([question.result]);while(opts.size<3){let v=question.result+rand(-8,8);if(v>=0&&v<=39)opts.add(v)}const arr=[...opts].sort(()=>Math.random()-.5);$('answers').innerHTML='';arr.forEach(v=>{const btn=document.createElement('button');btn.className='answer';btn.textContent=v;btn.onclick=()=>answer(v,btn);$('answers').appendChild(btn)});updateMarkers()}function showSteps(){const q=question;$('steps').innerHTML=`🪄 ${q.a} − ${q.first} = ${q.bridge}<br>✨ ${q.bridge} − ${q.rest} = <b>${q.result}</b>`;$('hint').textContent=`Spezza ${q.b} in ${q.first} e ${q.rest}.`;speak(`Per arrivare a ${q.bridge}, togli ${q.first}. Poi togli altri ${q.rest}.`);sound(640)}function answer(v,btn){if(locked)return;if(v!==question.result){btn.style.background='#ff9b9b';btn.animate([{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:220});toast('💗 Riprova, Julie!');sound(230,.2,'triangle');return}locked=true;score+=10;gems++;round++;$('stars').textContent=score;$('gems').textContent=gems;$('level').textContent=Math.floor(round/5)+1;$('fill').style.width=`${round%5/5*100}%`;btn.style.background='#9ff5b3';toast(['🌟 Bravissima Julie!','✨ Che magia!','🎉 Fantastico!','💖 Sei una campionessa!'][rand(0,3)]);sound(660,.12);setTimeout(()=>sound(880,.2),120);celebrate();$('next').hidden=false;$('help').hidden=true;$('hint').textContent='Hai conquistato una stella! ⭐';if(round%5===0){toast('🏆 LIVELLO COMPLETATO!');speak('Grandissima Julie! Hai superato un livello!');}else speak('Bravissima Julie!')}function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',+x.dataset.mode===m));makeQuestion();toast(m===10?'🌈 Missione tappa al 10':'🚀 Missione tappa al 20')}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(+b.dataset.mode));$('help').onclick=showSteps;$('next').onclick=makeQuestion;$('mute').onclick=()=>{audio=!audio;$('mute').textContent=audio?'🔊':'🔇';if(!audio&&'speechSynthesis'in window)speechSynthesis.cancel()};$('start').onclick=()=>{$('overlay').hidden=true;$('panel').hidden=false;makeQuestion();speak('Ciao Julie! Benvenuta nel regno delle stelle magiche!')};
// Scena 3D
if(!window.THREE){document.body.style.background='linear-gradient(#4239a9,#e0a4fa)';toast('Modalità leggera');return}const scene=new THREE.Scene();scene.background=new THREE.Color(0x20164f);scene.fog=new THREE.FogExp2(0x251752,.013);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,350);camera.position.set(0,12,27);camera.lookAt(0,5,0);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xaddaff,0x382269,2.1));const sun=new THREE.DirectionalLight(0xffd5a0,3);sun.position.set(-14,24,16);sun.castShadow=true;scene.add(sun);const mat=(c,em=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.52,metalness:.1,emissive:em,emissiveIntensity:.24});const grass=mat(0x37b99b),pink=mat(0xff84c7),purple=mat(0x9d8ef5),gold=mat(0xffd365),white=mat(0xffffff),wood=mat(0x875baf);function mesh(g,m,x,y,z){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}mesh(new THREE.CylinderGeometry(26,31,2,64),grass,0,-2,0);mesh(new THREE.CylinderGeometry(30,35,4,64),mat(0x7962c2),0,-5,0);const towers=[];for(let i=-1;i<=1;i++){let x=i*6;mesh(new THREE.CylinderGeometry(2,2.5,11,10),i===0?white:purple,x,4,-12);mesh(new THREE.ConeGeometry(3.1,5.5,10),pink,x,12.3,-12);towers.push(x)}mesh(new THREE.BoxGeometry(13,7,4),white,0,2,-12);mesh(new THREE.BoxGeometry(3,5,.5),wood,0,0,-9.7);for(let i=-1;i<=1;i++)mesh(new THREE.SphereGeometry(.5,12,12),gold,i*5,6.5,-9.5);const path=mesh(new THREE.BoxGeometry(5,.12,26),mat(0xffdca9),0,-.85,7);for(let i=0;i<32;i++){const x=rand(-24,24),z=rand(-10,23);if(Math.abs(x)<4)continue;mesh(new THREE.CylinderGeometry(.17,.24,1.5,7),mat(0x65d3a3),x,-.15,z);mesh(new THREE.IcosahedronGeometry(rand(6,12)/10,0),i%2?pink:gold,x,.8,z)}const starGeo=new THREE.OctahedronGeometry(.65);let floating=[];for(let i=0;i<24;i++){let x=(Math.random()-.5)*45,z=(Math.random()-.5)*42;const s=mesh(starGeo,mat(i%2?0xffe57d:0x9deeff,0xffd365),x,rand(4,14),z);floating.push({s,phase:Math.random()*6})}const avatar=new THREE.Group();scene.add(avatar);avatar.position.set(0,.25,8);function part(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);avatar.add(o);return o}part(new THREE.CylinderGeometry(.8,1.1,2.3,12),pink,0,1.8,0);part(new THREE.SphereGeometry(.85,24,16),mat(0xffd7ba),0,3.7,0);part(new THREE.SphereGeometry(.92,24,16),mat(0x694088),0,4.12,-.2);part(new THREE.SphereGeometry(.2,12,12),white,-.32,3.8,.75);part(new THREE.SphereGeometry(.2,12,12),white,.32,3.8,.75);part(new THREE.SphereGeometry(.09,12,12),mat(0x322353),-.32,3.8,.92);part(new THREE.SphereGeometry(.09,12,12),mat(0x322353),.32,3.8,.92);part(new THREE.ConeGeometry(.55,1.6,8),gold,0,5.3,0);const particles=[];function celebrate(){for(let i=0;i<35;i++){let s=mesh(new THREE.OctahedronGeometry(.15+Math.random()*.2),mat([0xffe27b,0x80ffe5,0xffa0e5][i%3]),0,4,8);particles.push({s,vx:(Math.random()-.5)*.32,vy:Math.random()*.3+.13,vz:(Math.random()-.5)*.3,life:95})}}function updateMarkers(){}let t=0;function animate(){requestAnimationFrame(animate);t+=.015;avatar.position.y=.2+Math.sin(t*2)*.17;avatar.rotation.y=Math.sin(t*.7)*.12;floating.forEach(o=>{o.s.rotation.y+=.012;o.s.position.y+=Math.sin(t+o.phase)*.006});for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.s.position.x+=p.vx;p.s.position.y+=p.vy;p.s.position.z+=p.vz;p.vy-=.008;p.s.rotation.y+=.12;if(--p.life<=0){scene.remove(p.s);particles.splice(i,1)}}camera.position.x=Math.sin(t*.19)*2.2;camera.lookAt(0,4,-2);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();
</script></body></html>
