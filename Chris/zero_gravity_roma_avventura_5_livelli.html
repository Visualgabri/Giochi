<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ZERO GRAVITY ROMA • HERO ARENA</title><style>*{box-sizing:border-box}body{margin:0;background:#050918;color:white;font-family:system-ui,Arial;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none} .panel{background:#071126bc;border:1px solid #5de8ff66;border-radius:15px;padding:9px 12px;backdrop-filter:blur(12px);font-weight:800;font-size:13px;text-shadow:0 2px 4px black}#bar{height:8px;background:#421c36;border-radius:20px;overflow:hidden;margin-top:5px;width:125px}#hp{height:100%;background:linear-gradient(90deg,#ff395f,#ffcf52);width:100%}#controls{position:fixed;bottom:18px;left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:10px;pointer-events:auto;align-items:end}.btn{border:1px solid #a8efff88;background:linear-gradient(145deg,#17366ecc,#0a163cdd);color:white;border-radius:50%;width:67px;height:67px;font-size:24px;font-weight:900;box-shadow:0 7px 25px #0009,inset 0 0 15px #47baff33;touch-action:none;user-select:none}.btn:active{transform:scale(.92);background:#1c83ad}.big{width:83px;height:83px;background:linear-gradient(145deg,#ff6d2c,#a8134e)}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#102b58d9,#030715f5);padding:20px;text-align:center}#menu{max-width:520px;width:100%;border:1px solid #5be9ff80;background:#07132ddc;padding:25px 20px;border-radius:28px;box-shadow:0 0 70px #00caff22}h1{font-size:clamp(34px,8vw,60px);line-height:.95;margin:8px 0;background:linear-gradient(90deg,#fff,#51edff,#ffdc6a);color:transparent;background-clip:text}h2{font-size:16px;letter-spacing:5px;color:#61e8ff}p{color:#c9d9ed}.pick{display:flex;gap:9px;justify-content:center;margin:22px 0;flex-wrap:wrap}.hero{border:1px solid #4f85aa;background:#122849;color:#fff;border-radius:16px;padding:12px 14px;font-weight:900}.hero.selected{border-color:#65f8ff;background:#176387;box-shadow:0 0 20px #00ddff55}.start{border:0;border-radius:18px;background:linear-gradient(90deg,#06c9e9,#5977ff);color:#fff;font-size:20px;font-weight:900;padding:16px 36px;box-shadow:0 8px 30px #00bfff55}.small{font-size:12px;color:#9bb4cc}#swap{position:fixed;bottom:110px;right:15px;border-radius:12px;padding:9px 12px;font-size:12px;background:#12365dcc;border:1px solid #72e8ff77;color:white;font-weight:900}#toast{position:fixed;top:105px;width:100%;text-align:center;font-weight:900;font-size:20px;text-shadow:0 3px 10px black;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="panel">🛡️ <span id="name">CAPITAN AMERICA</span><div id="bar"><div id="hp"></div></div></div><div class="panel">⭐ <span id="score">0</span> &nbsp; 🚒 <span id="wave">1</span></div></div><div id="toast"></div><button id="audioToggle" style="position:fixed;top:76px;right:12px;z-index:3;border:1px solid #70ddff88;border-radius:12px;padding:9px;background:#11284c;color:white;font-weight:800">🔊 AUDIO ON</button><button id="swap" hidden>CAMBIA EROE ↻</button><div id="controls" hidden><div class="cluster"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="cluster"><button class="btn" id="jump">⬆</button><button class="btn big" id="attack">⚡</button></div></div><div id="overlay"><div id="menu"><h2>TRAMPOLINE SUPER ARENA</h2><h1>ZERO GRAVITY<br>ROMA</h1><p>Quattro supereroi, salti incredibili e un camion dei pompieri impazzito da sconfiggere!</p><div class="pick"><button class="hero selected" data-hero="0">🛡️ CAPITAN AMERICA</button><button class="hero" data-hero="1">🕷️ SPIDER-MAN</button><button class="hero" data-hero="2">💚 HULK</button><button class="hero" data-hero="3">🦸 SUPERMAN</button></div><button class="start" id="start">▶ INIZIA L'AVVENTURA</button><p class="small">Muoviti ◀ ▶, salta sui trampolini, usa il superpotere ⚡<br>Computer: A/D, Spazio, J, tasto C per cambiare eroe</p></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,DPR,ground,platforms=[],particles=[],shots=[],enemies=[],stars=[],hero=0,score=0,wave=1,playing=false,frame=0,shake=0,keys={},player={x:100,y:100,vx:0,vy:0,hp:100,cd:0,inv:0},cam=0;const heroes=['CAPITAN AMERICA','SPIDER-MAN','HULK','SUPERMAN'];let audioCtx=null,audioOn=true;let stage=0,stageKills=0,transition=0,finished=false;const worlds=[{name:'ZERO GRAVITY ROMA',sub:'ARENA DEI TRAMPOLINI',top:'#071029',mid:'#172654',bottom:'#061329',accent:'#29cfff'},{name:'ROMA NOTTURNA',sub:'TETTI DEL COLOSSEO',top:'#200d38',mid:'#562452',bottom:'#180c30',accent:'#ffb44d'},{name:'METROPOLI FUTURISTICA',sub:'GRATTACIELI NEON',top:'#061b32',mid:'#113b50',bottom:'#091b30',accent:'#44ffbd'},{name:'BASE SPAZIALE',sub:'ORBITA TERRESTRE',top:'#03051d',mid:'#18235c',bottom:'#080b29',accent:'#ba84ff'},{name:'VULCANO FINALE',sub:'IL CAMION DEI POMPIERI GIGANTE',top:'#270b1b',mid:'#682024',bottom:'#1e0a13',accent:'#ff6b31'}];const killsNeeded=[4,5,6,7,1];function stageLabel(){document.getElementById('wave').textContent=(stage+1)+' / '+worlds.length;document.getElementById('toast').textContent='🌍 LIVELLO '+(stage+1)+' • '+worlds[stage].name+' • '+stageKills+'/'+killsNeeded[stage];}function nextStage(){stage++;stageKills=0;wave=stage+1;transition=140;enemies=[];shots=[];player.x=100;player.y=ground-70;player.vy=0;cam=0;player.hp=Math.min(100,player.hp+35);tone(523,.25,'triangle');setTimeout(()=>tone(784,.3,'triangle'),150);setTimeout(()=>tone(1046,.45,'triangle'),300);stageLabel();spawn()}function win(){playing=false;finished=true;document.getElementById('overlay').style.display='grid';document.querySelector('#menu p').textContent='🏆 HAI SALVATO TUTTI I MONDI! Punteggio finale: '+score+'!';document.getElementById('start').textContent='▶ NUOVA AVVENTURA';document.getElementById('controls').hidden=true;document.getElementById('swap').hidden=true;for(let i=0;i<100;i++)burst(player.x,player.y-100,['#ffdc64','#65f8ff','#fc63a5'][i%3],2)}function tone(freq=440,duration=.13,type='sine',volume=.07,slide=0){if(!audioOn)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+duration);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration)}catch(e){}}document.getElementById('audioToggle').onclick=()=>{audioOn=!audioOn;document.getElementById('audioToggle').textContent=audioOn?'🔊 AUDIO ON':'🔇 AUDIO OFF';if(audioOn)tone(660,.15)};function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);ground=H-105;platforms=[{x:0,y:ground,w:W*2.4,h:35},{x:W*.2,y:ground-135,w:160,h:18},{x:W*.67,y:ground-245,w:155,h:18},{x:W*1.17,y:ground-155,w:175,h:18},{x:W*1.72,y:ground-265,w:160,h:18}];stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.5}))}addEventListener('resize',resize);resize();function rnd(a,b){return a+Math.random()*(b-a)}function burst(px,py,color,n=18){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:rnd(-7,7),vy:rnd(-9,3),life:rnd(18,48),color,r:rnd(2,6)})}function spawn(){let xx=Math.max(W*.7,player.x+W*.7);enemies.push({x:xx,y:ground-54,vx:-rnd(1.4,2.7)-wave*.12,hp:stage===4?34:3+Math.floor(stage/2),hit:0,boss:stage===4})}function reset(){tone(523,.2,'triangle');setTimeout(()=>tone(784,.3,'triangle'),130);player={x:100,y:ground-70,vx:0,vy:0,hp:100,cd:0,inv:0};score=0;wave=1;stage=0;stageKills=0;transition=0;finished=false;frame=0;enemies=[];shots=[];particles=[];cam=0;spawn();stageLabel();document.getElementById('controls').hidden=false;document.getElementById('swap').hidden=false;document.getElementById('overlay').style.display='none';playing=true;requestAnimationFrame(loop)}function switchHero(v){hero=(v+4)%4;document.getElementById('name').textContent=heroes[hero];document.querySelectorAll('.hero').forEach((b,i)=>b.classList.toggle('selected',i===hero));tone(620,.13,'triangle');burst(player.x,player.y-35,['#9ee9ff','#ff354f','#56ff74','#f9e65e'][hero],24)}document.querySelectorAll('.hero').forEach(b=>b.onclick=()=>switchHero(+b.dataset.hero));document.getElementById('start').onclick=reset;document.getElementById('swap').onclick=()=>switchHero(hero+1);for(let k of ['left','right','jump','attack']){let b=document.getElementById(k);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(let t of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(t,()=>keys[k]=false)}addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();let k={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyJ:'attack',KeyK:'attack'}[e.code];if(k)keys[k]=true;if(e.code==='KeyC'&&!e.repeat)switchHero(hero+1)});addEventListener('keyup',e=>{let k={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyJ:'attack',KeyK:'attack'}[e.code];if(k)keys[k]=false});function attack(){if(player.cd>0)return;player.cd=hero===2?35:hero===3?16:22;tone(hero===3?880:hero===2?110:hero===1?550:380,.17,hero===3?'sawtooth':'triangle',.06,-180);let dir=player.vx<-.2?-1:1;if(hero===2){burst(player.x+dir*50,player.y-30,'#76ff57',28);enemies.forEach(e=>{if(Math.abs(e.x-player.x)<160&&Math.abs(e.y-player.y)<110){e.hp-=3;e.hit=12}});shake=9}else{shots.push({x:player.x+dir*30,y:player.y-37,vx:dir*(hero===3?19:hero===1?15:12),life:55,type:hero});burst(player.x+dir*20,player.y-37,hero===0?'#91eaff':'#ff5068',9)}}function rect(a,b,w,h){return a<w+b&&a+36>b}function update(){frame++;if(transition>0)transition--;let speed=hero===1?5.6:hero===2?4.1:hero===3?6.2:4.8;player.vx=(keys.right?speed:0)-(keys.left?speed:0);player.x=Math.max(25,Math.min(W*2.35,player.x+player.vx));if(keys.jump&&player.grounded){player.vy=hero===2?-18:hero===3?-23:-16;player.grounded=false;burst(player.x,player.y,'#47e6ff',10);tone(hero===3?780:360,.2,'sine',.045,300)}if(keys.attack)attack();let oldBottom=player.y;player.vy+=.53;player.y+=player.vy;player.grounded=false;for(let p of platforms){if(player.vy>=0&&oldBottom<=p.y+12&&player.y>=p.y&&player.x+20>p.x&&player.x-20<p.x+p.w){player.y=p.y;player.vy=0;player.grounded=true;if(p.y<ground&&frame%18===0)burst(player.x,player.y,'#50d9ff',4)}}if(player.y>H+150){player.y=ground-100;player.x=80;player.hp-=15}if(player.cd)player.cd--;if(player.inv)player.inv--;for(let s of shots){s.x+=s.vx;s.life--;for(let e of enemies)if(Math.abs(s.x-e.x)<52&&Math.abs(s.y-(e.y+20))<45){e.hp-=s.type===0?2:s.type===3?3:1;tone(150,.11,'square',.045,-80);e.hit=10;s.life=0;burst(e.x,e.y,'#ffbb41',12)}}shots=shots.filter(s=>s.life>0);for(let e of enemies){e.x+=e.vx;e.hit=Math.max(0,e.hit-1);if(e.x<25||e.x>W*2.35)e.vx*=-1;if(Math.abs(player.x-e.x)<57&&Math.abs(player.y-(e.y+54))<75&&!player.inv){player.hp-=12;tone(125,.25,'sawtooth',.1,-85);player.inv=60;player.vy=-8;shake=10;burst(player.x,player.y-35,'#ff536d',20)}if(e.hp<=0){score+=e.boss?1500:100;stageKills++;tone(660,.18,'triangle');setTimeout(()=>tone(990,.23,'triangle'),100);burst(e.x,e.y,'#ffb72b',45);e.dead=true;shake=13}}enemies=enemies.filter(e=>!e.dead);if(!enemies.length){if(stageKills>=killsNeeded[stage]){if(stage===worlds.length-1){win();return}else nextStage()}else{player.hp=Math.min(100,player.hp+7);spawn();stageLabel()}}for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.17;p.life--}particles=particles.filter(p=>p.life>0);cam+=(Math.max(0,Math.min(player.x-W*.35,W*1.4))-cam)*.08;document.getElementById('score').textContent=score;document.getElementById('wave').textContent=(stage+1)+' / '+worlds.length;document.getElementById('hp').style.width=Math.max(0,player.hp)+'%';if(player.hp<=0){playing=false;document.getElementById('overlay').style.display='grid';document.querySelector('#menu p').textContent='Hai conquistato '+score+' punti! Il camion dei pompieri vuole la rivincita!';document.getElementById('start').textContent='↻ RIGIOCA';document.getElementById('controls').hidden=true;document.getElementById('swap').hidden=true}}
function roundRect(a,b,w,h,r,fill){x.fillStyle=fill;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}function drawHero(px,py){x.save();x.translate(px,py);if(player.inv&&frame%6<3)x.globalAlpha=.4;let color=['#2866e7','#ed263c','#4acb49','#2368df'][hero];x.shadowColor=color;x.shadowBlur=22;roundRect(-17,-55,34,44,12,color);roundRect(-14,-14,11,17,4,color);roundRect(3,-14,11,17,4,color);x.fillStyle=hero===2?'#62de50':hero===1?'#df1d35':'#2763d9';x.beginPath();x.arc(0,-67,19,0,Math.PI*2);x.fill();x.shadowBlur=0;if(hero===0){x.fillStyle='#fff';x.font='bold 19px system-ui';x.textAlign='center';x.fillText('A',0,-61);x.beginPath();x.arc(-23,-31,20,0,Math.PI*2);x.fillStyle='#d62843';x.fill();x.beginPath();x.arc(-23,-31,15,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.beginPath();x.arc(-23,-31,10,0,Math.PI*2);x.fillStyle='#225bd2';x.fill();x.fillStyle='#fff';x.font='18px system-ui';x.fillText('★',-23,-25)}else if(hero===1){x.fillStyle='white';x.beginPath();x.ellipse(-8,-68,7,4,-.4,0,7);x.ellipse(8,-68,7,4,.4,0,7);x.fill();x.strokeStyle='#102048';x.lineWidth=2;for(let i=-1;i<=1;i++){x.beginPath();x.moveTo(-16,-50+i*10);x.lineTo(16,-50+i*10);x.stroke()}}else if(hero===3){x.fillStyle='#e5233c';x.beginPath();x.moveTo(-17,-52);x.lineTo(-34,-6);x.lineTo(0,-17);x.lineTo(33,-6);x.lineTo(17,-52);x.fill();x.fillStyle='#fbe96c';x.font='bold 25px system-ui';x.textAlign='center';x.fillText('S',0,-24);x.fillStyle='#e5233c';x.fillRect(-14,-75,28,5)}else{x.fillStyle='#152e20';x.beginPath();x.moveTo(-18,-76);x.lineTo(-12,-88);x.lineTo(1,-81);x.lineTo(14,-87);x.lineTo(19,-74);x.fill();x.fillStyle='#222';roundRect(-22,-54,8,29,3,'#54bb46');roundRect(14,-54,8,29,3,'#54bb46')}x.restore()}
function drawTruck(e){x.save();x.translate(e.x,e.y);if(e.hit)x.filter='brightness(2)';x.shadowColor='#ff4b2b';x.shadowBlur=18;roundRect(-51,0,75,48,9,'#db1e2c');roundRect(13,12,45,36,7,'#fa3c33');roundRect(20,17,27,17,3,'#83e6ff');roundRect(-47,7,65,7,2,'#ffe46a');roundRect(-34,-12,57,10,4,'#cdd9e9');roundRect(-27,-22,42,9,3,'#ecf3ff');x.fillStyle='#ffcc3b';x.fillRect(-32,-28,13,7);x.fillStyle='#ff3344';x.fillRect(-7,-28,13,7);for(let a of [-30,37]){x.beginPath();x.arc(a,49,13,0,7);x.fillStyle='#101a2b';x.fill();x.beginPath();x.arc(a,49,6,0,7);x.fillStyle='#c9eaff';x.fill()}x.fillStyle='white';x.font='bold 13px system-ui';x.fillText('🚒',-13,37);x.restore()}
function draw(){x.save();if(shake){x.translate(rnd(-shake,shake),rnd(-shake,shake));shake*=.8;if(shake<.5)shake=0}let world=worlds[stage];let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,world.top);bg.addColorStop(.55,world.mid);bg.addColorStop(1,world.bottom);x.fillStyle=bg;x.fillRect(-30,-30,W+60,H+60);for(let s of stars){x.fillStyle='#7ccfff'+(Math.floor((Math.sin(frame*.03+s.x)+1)*70+80)).toString(16);x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}x.save();x.translate(-cam*.2,0);for(let i=0;i<12;i++){let xx=i*210-50;roundRect(xx,ground-300+(i%3)*40,175,310,10,stage===1?'#352038':stage===2?'#102c39':stage===3?'#1c2051':stage===4?'#4b1821':'#122448');for(let j=0;j<7;j++)for(let k=0;k<3;k++)roundRect(xx+18+k*51,ground-272+(i%3)*40+j*35,22,16,3,(i+j+k)%3?'#1e4672':world.accent)}x.restore();x.save();x.translate(-cam,0);x.fillStyle='#71f5ff';x.font='900 38px system-ui';x.shadowColor='#00ddff';x.shadowBlur=20;x.fillText(world.name,W*.23,ground-340);x.font='900 22px system-ui';x.fillText(world.sub,W*.25,ground-305);x.shadowBlur=0;for(let p of platforms){roundRect(p.x,p.y,p.w,p.h,9,'#183a65');roundRect(p.x,p.y,p.w,9,5,world.accent);for(let j=8;j<p.w-8;j+=28){x.fillStyle='#f755ca';x.fillRect(p.x+j,p.y+11,12,3)}}for(let e of enemies){if(e.boss){x.save();x.translate(e.x,e.y);x.scale(1.75,1.75);x.translate(-e.x,-e.y);drawTruck(e);x.restore();x.fillStyle='#ffcd52';x.fillRect(e.x-70,e.y-50,140*Math.max(0,e.hp/34),7)}else drawTruck(e)}for(let s of shots){x.save();x.translate(s.x,s.y);x.rotate(frame*.3);x.shadowColor=s.type===3?'#ff3030':s.type===0?'#68dfff':'#f54e69';x.shadowBlur=25;x.fillStyle=s.type===3?'#ff3333':s.type===0?'#9ceaff':'#ff6379';x.beginPath();x.arc(0,0,s.type===0?15:9,0,7);x.fill();x.fillStyle='white';x.font='15px system-ui';x.textAlign='center';x.fillText(s.type===3?'⚡':s.type===0?'★':'✦',0,5);x.restore()}drawHero(player.x,player.y);for(let p of particles){x.globalAlpha=Math.min(1,p.life/22);x.fillStyle=p.color;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1;x.restore();if(transition>0){x.fillStyle='rgba(0,0,0,'+Math.min(.82,transition/180)+')';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.shadowColor=world.accent;x.shadowBlur=25;x.font='900 '+Math.min(38,W/12)+'px system-ui';x.fillText('LIVELLO '+(stage+1),W/2,H*.37);x.font='bold '+Math.min(23,W/20)+'px system-ui';x.fillText(world.name,W/2,H*.46);x.shadowBlur=0}x.restore()}
function loop(){if(!playing)return;update();draw();requestAnimationFrame(loop)}draw();</script></body></html>
