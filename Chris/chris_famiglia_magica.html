<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Chris e la Famiglia Magica</title><style>*{box-sizing:border-box}body{margin:0;background:#090b2c;color:white;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#top{display:flex;justify-content:space-between;align-items:center;padding:14px;gap:8px;font-size:clamp(14px,3vw,22px);font-weight:900;text-shadow:0 3px 8px #000}#score,#life{background:#171b55bb;border:2px solid #ffffff55;border-radius:20px;padding:9px 14px;backdrop-filter:blur(8px)}#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,480px);padding:25px 18px;text-align:center;background:linear-gradient(140deg,#4024a8ef,#122c79f5);border:3px solid #ffe576;border-radius:32px;box-shadow:0 0 65px #a24dff99;pointer-events:auto}h1{font-size:clamp(28px,7vw,44px);line-height:1.08;margin:8px 0;color:#fff39a;text-shadow:0 4px #a33c9b}p{font-size:18px;line-height:1.45}button{border:0;border-radius:22px;padding:15px 24px;background:linear-gradient(#ffef73,#ff9c2e);font-weight:1000;font-size:22px;color:#40205b;box-shadow:0 7px #b15b20;cursor:pointer;pointer-events:auto}button:active{transform:translateY(5px);box-shadow:0 2px #b15b20}#controls{position:absolute;bottom:22px;width:100%;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}.ctrl{width:82px;height:82px;border-radius:50%;background:#ffffff33;color:white;border:3px solid #ffffff99;box-shadow:0 5px 25px #0005;font-size:37px;touch-action:none;pointer-events:auto;backdrop-filter:blur(8px)}#jump{background:#ff66aacc;width:105px;height:105px;font-size:20px}#message{position:absolute;top:18%;left:50%;transform:translateX(-50%);text-align:center;font-size:clamp(19px,4vw,30px);font-weight:1000;text-shadow:0 3px 10px #000;white-space:nowrap}#mute{position:absolute;right:12px;top:80px;background:#ffffff33;color:white;box-shadow:none;font-size:19px;padding:8px 12px}.hide{display:none!important}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="top"><span id="score">⭐ 0 / 12</span><span id="life">❤️❤️❤️</span></div><div id="message"></div><button id="mute">🔊</button><div id="controls"><div><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><button class="ctrl" id="jump">SALTA 🚀</button></div><div id="panel"><div style="font-size:65px">👦🏻🌈🏰</div><h1>CHRIS E LA<br>FAMIGLIA MAGICA</h1><p>Raccogli 12 stelle! ⭐<br>Evita i mostriciattoli 👾<br>Trova papà, mamma e Julie per ricevere superpoteri! 💖</p><button id="start">GIOCHIAMO! 🎮</button><p style="font-size:13px">Usa le frecce e SALTA, oppure la tastiera</p></div></div><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let W,H,dpr,run=false,win=false,score=0,lives=3,cam=0,t=0,muted=false,keys={},particles=[],items=[],enemies=[],family=[],player={x:70,y:0,vx:0,vy:0,r:23,ground:false,inv:0,power:0};const ground=()=>H*.79;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function sound(freq=600,dur=.1,type='sine'){if(muted)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,a.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.5,a.currentTime+dur);g.gain.setValueAtTime(.07,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);o.onended=()=>a.close()}catch(e){}}function reset(){score=0;lives=3;cam=0;win=false;player={x:70,y:ground()-23,vx:0,vy:0,r:23,ground:true,inv:0,power:0};items=Array.from({length:28},(_,i)=>({x:230+i*175,y:ground()-65-(i%3)*58,got:false}));enemies=Array.from({length:11},(_,i)=>({x:490+i*410,base:490+i*410,dir:i%2?1:-1}));family=[{x:850,e:'👨🏻',name:'PAPÀ GABRIELE',msg:'SUPER VELOCITÀ! ⚡'},{x:2050,e:'👩🏻',name:'MAMMA JESSICA',msg:'SCUDO MAGICO! 🛡️'},{x:3550,e:'👧🏻',name:'JULIE',msg:'SALTO STELLARE! 🌈'}];family.forEach(f=>f.got=false);particles=[];document.querySelector('#panel').classList.add('hide');run=true;updateUI()}function updateUI(){document.querySelector('#score').textContent=`⭐ ${score} / 12`;document.querySelector('#life').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}function burst(px,py,color,n=15){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*11,vy:(Math.random()-.7)*12,life:35+Math.random()*25,color})}let msgTimer=0;function say(s){document.querySelector('#message').textContent=s;msgTimer=150}function end(w){run=false;win=w;let p=document.querySelector('#panel');p.classList.remove('hide');p.innerHTML=w?'<div style="font-size:70px">🏆🌈🎉</div><h1>BRAVISSIMO CHRIS!</h1><p>Hai salvato il Regno delle Stelle!<br>La tua famiglia è fiera di te! ❤️</p><button id="again">GIOCA ANCORA ⭐</button>':'<div style="font-size:65px">💖🧸</div><h1>RIPROVIAMO CHRIS!</h1><p>La famiglia è sempre con te!<br>Puoi farcela! 💪</p><button id="again">RIPARTI 🚀</button>';document.querySelector('#again').onclick=reset;sound(w?950:240,.4)}function roundRect(a,b,w,h,r,fill){x.fillStyle=fill;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}function emoji(e,px,py,size){x.font=`${size}px system-ui`;x.textAlign='center';x.textBaseline='middle';x.fillText(e,px,py)}function draw(){t++;let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#101653');sky.addColorStop(.6,'#6639ae');sky.addColorStop(1,'#f38cc7');x.fillStyle=sky;x.fillRect(0,0,W,H);for(let i=0;i<65;i++){let sx=((i*137+33-cam*.12)%(W+120)+(W+120))%(W+120),sy=(i*83)%(H*.68);x.globalAlpha=.3+.5*Math.abs(Math.sin(t*.02+i));emoji('✦',sx,sy,9+i%8)}x.globalAlpha=1;emoji('🌙',W*.82,95,75);for(let k=0;k<3;k++){x.fillStyle=['#7044a5','#583b92','#3e3686'][k];x.beginPath();x.moveTo(0,ground());for(let sx=0;sx<=W+12;sx+=12)x.lineTo(sx,ground()-80-k*25+Math.sin((sx+cam*(.15+k*.12))*0.006+k)*42);x.lineTo(W,H);x.lineTo(0,H);x.fill()}let off=cam;roundRect(0,ground(),W,H-ground(),15,'#2a9e86');roundRect(0,ground(),W,18,8,'#74e3a0');for(let i=Math.floor(off/95)-1;i<Math.ceil((off+W)/95)+1;i++){let px=i*95-off;emoji(i%3?'🌷':'🌼',px,ground()+40+Math.sin(t*.04+i)*3,26);if(i%4===0)emoji('🍄',px+45,ground()-6,31)}for(let f of family){if(f.got)continue;let px=f.x-off;if(px>-80&&px<W+80){x.shadowColor='#ffdc65';x.shadowBlur=30;emoji('✨',px,ground()-130,45);emoji(f.e,px,ground()-49+Math.sin(t*.05)*5,65);x.shadowBlur=0;x.font='bold 13px system-ui';x.fillStyle='#fff';x.textAlign='center';x.fillText(f.name,px,ground()-106)}}for(let s of items){if(s.got)continue;let px=s.x-off;if(px>-50&&px<W+50){x.shadowColor='#fff06b';x.shadowBlur=25;emoji('⭐',px,s.y+Math.sin(t*.065+s.x)*7,38);x.shadowBlur=0}}for(let e of enemies){let px=e.x-off;if(px>-50&&px<W+50)emoji('👾',px,ground()-26+Math.sin(t*.1+e.x)*4,43)}let px=player.x-off;if(player.power>0){x.shadowColor='#75faff';x.shadowBlur=30;emoji('🫧',px,player.y,72);x.shadowBlur=0}if(player.inv%10<5){emoji('👦🏻',px,player.y,52);emoji('👟',px-12,player.y+22,21)}for(let p of particles){x.globalAlpha=Math.max(0,p.life/55);x.fillStyle=p.color;x.beginPath();x.arc(p.x-off,p.y,3+Math.random()*3,0,7);x.fill()}x.globalAlpha=1;if(!run&&!win){/* title overlay */}}function tick(){requestAnimationFrame(tick);if(run){let dir=(keys.right?1:0)-(keys.left?1:0);player.vx=dir*(player.power>0?6.8:4.6);player.x=Math.max(25,Math.min(5100,player.x+player.vx));if(keys.jump&&player.ground){player.vy=player.power>0?-16:-13.8;player.ground=false;sound(350,.13)}player.vy+=.62;player.y+=player.vy;if(player.y>=ground()-23){player.y=ground()-23;player.vy=0;player.ground=true}cam=Math.max(0,player.x-W*.3);for(let s of items){if(!s.got&&Math.hypot(player.x-s.x,player.y-s.y)<43){s.got=true;score++;burst(s.x,s.y,'#ffe66b');sound(650+score*25,.12);updateUI();if(score>=12){end(true);break}}}for(let f of family){if(!f.got&&Math.abs(player.x-f.x)<55&&Math.abs(player.y-(ground()-45))<90){f.got=true;player.power=550;burst(f.x,ground()-80,'#ff83f7',35);say(f.name+' '+f.msg);sound(850,.3)}}for(let e of enemies){e.x+=Math.sin(t*.025+e.base)*.9;if(player.inv<=0&&Math.abs(player.x-e.x)<36&&Math.abs(player.y-(ground()-25))<35){if(player.power>0){burst(e.x,ground()-25,'#81ffff');e.x=e.base+180;sound(500,.12)}else{lives--;player.inv=90;player.vy=-9;burst(player.x,player.y,'#ff6699');sound(180,.3,'sawtooth');updateUI();if(lives<=0)end(false)}}}player.inv=Math.max(0,player.inv-1);player.power=Math.max(0,player.power-1);for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.23;p.life--}particles=particles.filter(p=>p.life>0);if(msgTimer>0&&--msgTimer===0)document.querySelector('#message').textContent=''}draw()}tick();document.querySelector('#start').onclick=reset;document.querySelector('#mute').onclick=()=>{muted=!muted;document.querySelector('#mute').textContent=muted?'🔇':'🔊'};for(let id of ['left','right','jump']){let el=document.querySelector('#'+id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);keys[id]=true});el.addEventListener('pointerup',()=>keys[id]=false);el.addEventListener('pointercancel',()=>keys[id]=false)}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW'].includes(e.code))e.preventDefault();if(['ArrowLeft','KeyA'].includes(e.code))keys.left=true;if(['ArrowRight','KeyD'].includes(e.code))keys.right=true;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=true});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false;if(['ArrowUp','Space','KeyW'].includes(e.code))keys.jump=false});</script></body></html>
